name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scanlanka
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn -B verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/scanlanka
          DB_USER: test
          DB_PASSWORD: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Upload JAR for deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/scanlanka-backend-0.0.1-SNAPSHOT.jar
          retention-days: 3
          if-no-files-found: error

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to Hetzner
    needs: [build, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar

      - name: Write SSH key
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" | tr -d '\r' > ~/.ssh/hetzner.pem
          chmod 600 ~/.ssh/hetzner.pem
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload JAR as app.jar.new
        run: |
          scp -i ~/.ssh/hetzner.pem -o StrictHostKeyChecking=yes \
            scanlanka-backend-0.0.1-SNAPSHOT.jar \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:/opt/scanlanka/app.jar.new"

      - name: Swap JAR, restart, health-check
        run: |
          ssh -i ~/.ssh/hetzner.pem -o StrictHostKeyChecking=yes \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" bash -s <<'EOF'
          set -euo pipefail
          cd /opt/scanlanka
          docker compose up -d
          sudo systemctl stop scanlanka
          sudo mv app.jar.new app.jar
          sudo systemctl start scanlanka
          echo "Waiting for Spring Boot..."
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              echo "Health UP"
              sudo systemctl is-active scanlanka
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed"
          sudo journalctl -u scanlanka -n 80 --no-pager || true
          exit 1
          EOF
