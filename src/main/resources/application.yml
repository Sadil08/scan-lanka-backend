# Base config. Secrets come from env (global/02 §5) — never commit real values.
spring:
  application:
    name: scanlanka-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scanlanka?options=-c%20TimeZone%3DUTC}
    username: ${DB_USER:scanlanka_app}
    password: ${DB_PASSWORD:dev_only_change_me}
  jpa:
    hibernate:
      ddl-auto: validate          # schema owned by Flyway only (global/04 SCALE-DDL)
    open-in-view: false
    properties:
      hibernate.format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:                          # image upload limits (01 NFR-CATALOG-1)
      max-file-size: 5MB
      max-request-size: 6MB
  mail:                                 # SMTP for SmtpEmailProvider (10 D-Q1) — creds from env only
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework   # correct scheme behind a TLS-terminating proxy (HTTPS/HSTS)
  compression:                          # gzip JSON/text responses (cheap perf win)
    enabled: true
    mime-types: application/json,application/javascript,text/html,text/css,text/plain
    min-response-size: 1024
  servlet:
    encoding:
      charset: UTF-8

# Actuator: health public-ish; prometheus ADMIN-gated (global/04)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # spring-boot-starter-mail always creates a JavaMailSender (spring.mail.host has a default), which
    # otherwise adds a "mail" health indicator that opens an SMTP connection on every /actuator/health
    # probe — slow, and DOWN whenever SMTP is unconfigured. We surface SMTP failures via the worker instead.
    mail:
      enabled: false
  # Explicitly enable the Prometheus exporter. Without this the registry-specific flag is unset and
  # the export default resolves false, so no PrometheusMeterRegistry/scrape endpoint is created and
  # /actuator/prometheus 404s even though it is exposed (was the "prometheus not wired" gap).
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Structured logs carry the per-request correlation id (P1-7, see CorrelationIdFilter).
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId:-}] %-5level %logger{36} - %msg%n"

# App-specific config (filled per phase)
app:
  db-role-check:
    enabled: ${DB_ROLE_CHECK:false}
    fail-on-violation: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  storage:
    dir: ${STORAGE_DIR:./var/media}     # backend image store, outside web root (global/02 §8, T-20)
  notifications:
    admin-email: ${ADMIN_NOTIFY_EMAIL:orders@scanlanka.com}   # dispatch summaries go here
    from-email: ${MAIL_FROM:Scan Lanka <no-reply@scanlanka.com>}
    # Real SMTP off by default — dev uses LoggingEmailProvider. Set MAIL_ENABLED=true (+ MAIL_* creds)
    # to activate SmtpEmailProvider, which is @Primary and wins whenever present.
    smtp-enabled: ${MAIL_ENABLED:false}
    poll-ms: 15000
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  order:
    # Order-number signing secret — override by env in every real environment (global/02 §5).
    signing-secret: ${ORDER_SIGNING_SECRET:dev-only-order-signing-secret-change-me}
  payhere:
    merchant-id: ${PAYHERE_MERCHANT_ID:}
    merchant-secret: ${PAYHERE_MERCHANT_SECRET:}          # from secret manager (SEC-PAY-2)
    currency: LKR
    checkout-url: ${PAYHERE_CHECKOUT_URL:https://sandbox.payhere.lk/pay/checkout}
    notify-url: ${PAYHERE_NOTIFY_URL:http://localhost:8080/api/payments/payhere/notify}
    return-url: ${PAYHERE_RETURN_URL:http://localhost:3000/checkout/return}
    cancel-url: ${PAYHERE_CANCEL_URL:http://localhost:3000/checkout}
  auth:
    # Dev-only default (>= 32 bytes for HS256). MUST be overridden by env in every real environment.
    jwt-secret: ${JWT_SECRET:dev-only-change-me-please-rotate-32+bytes-secret}
    issuer: scanlanka
    audience: scanlanka-web
    access-ttl-minutes: 15
    refresh-ttl-days: 14
    cookie-secure: ${AUTH_COOKIE_SECURE:false}   # true in prod (HTTPS); false for local http
    otp-ttl-minutes: 10
    otp-max-attempts: 5
    initial-admin-email: ${INITIAL_ADMIN_EMAIL:}
    initial-admin-password: ${INITIAL_ADMIN_PASSWORD:}
    # Admin 2FA (TOTP) enforcement. Disabled for local development; MUST be true in production —
    # set ADMIN_TOTP_REQUIRED=true (07 FR-AUTH-10).
    admin-totp-required: ${ADMIN_TOTP_REQUIRED:false}
  captcha:
    secret: ${CAPTCHA_SECRET:test-captcha-bypass}
  quote:
    token-secret: ${QUOTE_TOKEN_SECRET:dev-only-quote-token-secret-change-me}
  support:
    token-secret: ${SUPPORT_TOKEN_SECRET:dev-only-support-token-secret-change-me}
  geo:
    provider: ${GEO_PROVIDER:stub}   # stub | ip-api
    ip-api-base: ${GEO_IP_API_BASE:https://ip-api.com}
